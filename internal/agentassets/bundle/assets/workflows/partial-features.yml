name: complex
on: [push]
jobs:
  verify:
    needs: [prepare]
    strategy:
      matrix:
        python: ['3.12', '3.13']
    services:
      postgres:
        image: postgres:16
    env:
      TOKEN: ${{ secrets.CI_TOKEN }}
      MODE: ${{ matrix.python }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python -m pytest
