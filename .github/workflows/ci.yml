name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  installer:
    name: Installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check installer and release packages
        run: PITSTOP_TEST_RELEASE=1 go test ./scripts -count=1

  verify:
    name: Verify Pitstop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          files="$(gofmt -l cmd internal scripts)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi

      - name: Verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Build CLI
        run: go build -trimpath -o "$RUNNER_TEMP/pitstop" ./cmd/pitstop

      - name: Check config-agent smoke and embedded configs
        run: PITSTOP_BIN="$RUNNER_TEMP/pitstop" PITSTOP_CONFIG_AGENT_RUNTIME=0 sh scripts/config-agent-smoke.sh

      - name: Set up platform-capable Docker
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5
        with:
          version: v29.8.2
          daemon-config: '{"features":{"containerd-snapshotter":true}}'

      - name: Run Docker checks on a real daemon
        run: PITSTOP_BIN="$RUNNER_TEMP/pitstop" sh scripts/docker-smoke.sh

      - name: Check CLI JSON output
        run: '"$RUNNER_TEMP/pitstop" version --json | go run ./scripts/validate-json.go'
