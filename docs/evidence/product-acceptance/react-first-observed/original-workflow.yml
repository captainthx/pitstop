name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter ats run lint

      - run: pnpm --filter ats run typecheck

      - run: pnpm --filter ats run build

      - run: pnpm --filter recruit100 run lint

      - run: pnpm --filter recruit100 run typecheck

      - run: pnpm --filter recruit100 run test

      # next build + the OpenNext Worker bundle deployed to Cloudflare.
      - run: pnpm --filter recruit100 run build:worker
